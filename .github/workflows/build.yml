name: Build Wheel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (e.g. v1.2.3)"
        required: true

jobs:
  build:
    runs-on: windows-latest
 
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
      VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          git -C vcpkg checkout $env:VCPKG_COMMIT
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Create Release-only Triplet
        shell: pwsh
        run: |
          $tripletDir = "${{ github.workspace }}\custom-triplets"

          New-Item -ItemType Directory -Force -Path $tripletDir
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

          @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)
          set(VCPKG_BUILD_TYPE release)
          "@ | Out-File `
              "$tripletDir\x64-windows-release.cmake"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}\vcpkg-cache
          key: vcpkg-${{ runner.os }}-x64-release-${{ env.VCPKG_COMMIT }}-v1
          restore-keys: |
            vcpkg-${{ runner.os }}-x64-release-${{ env.VCPKG_COMMIT }}-
            vcpkg-${{ runner.os }}-x64-release-

      - name: Install C++ dependencies
        shell: pwsh
        run: |
          .\vcpkg\vcpkg install `
            eigen3:x64-windows-release `
            opencv4[core,calib3d]:x64-windows-release `
            --overlay-triplets="${{ github.workspace }}\custom-triplets"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools pybind11

      - name: Build wheel
        shell: pwsh
        env:
          CMAKE_ARGS: >
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-release
        run: |
          python setup.py bdist_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheel-py*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.version }}
          files: dist/*.whl
