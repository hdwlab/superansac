name: Build Wheel

on:
  push:
    branches:
      - test-actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Checkout vcpkg
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: microsoft/vcpkg
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Create Release-only Triplet
        shell: pwsh
        run: |
          $tripletDir = "${{ github.workspace }}\vcpkg\triplets\community"

          New-Item -ItemType Directory -Force -Path $tripletDir

          @"
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_BUILD_TYPE release)
          "@ | Out-File `
              "$tripletDir\x64-windows-release.cmake"

      - name: Install OpenCV
        shell: pwsh
        run: |
          vcpkg install opencv4[core,calib3d]:x64-windows-release

      - name: Install Eigen
        shell: pwsh
        run: |
          vcpkg install eigen3:x64-windows-release

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools pybind11

      - name: Build wheel
        shell: pwsh
        env:
          CMAKE_ARGS: >
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-release
        run: |
          python setup.py bdist_wheel

      - name: Upload wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheel
          path: dist/*.whl
